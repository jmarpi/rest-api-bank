services:
  postgres:
    image: postgres:17-alpine
    env_file: .env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env.dev
    environment:
      DB_HOST: postgres
      SERVER_PORT: 8080
      # Se pueden sobrescribir desde el shell (p. ej. para simular una caída del Banco Mundial)
      WORLD_BANK_BASE_URL: ${WORLD_BANK_BASE_URL:-https://api.worldbank.org/v2}
      WORLD_BANK_TIMEOUT_SECONDS: ${WORLD_BANK_TIMEOUT_SECONDS:-10}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
